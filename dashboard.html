  <style>
    :root{--bg:#0b1220;--card:#071428;--muted:#9fb3d6;--text:#e6eef8;--accent:#15405a;--gold:#ffd166}
    body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
    header{padding:14px 18px;background:linear-gradient(90deg,#071031,#071a2a);display:flex;align-items:center;justify-content:space-between}
    .tabs{display:flex;gap:8px}
    .tab{padding:8px 12px;border-radius:8px;background:#071428;border:1px solid #0b2940;color:var(--muted);cursor:pointer}
    .tab.active{background:var(--accent);color:#fff}
    main{padding:18px}
    .panel{display:none}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
    .card{background:#061526;padding:12px;border-radius:8px}
    .org{background:#061526;padding:12px;border-radius:8px}
    .projBar{height:10px;background:#041426;border-radius:6px;overflow:hidden}
    .projFill{height:100%;background:#4ea1ff}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px;border-bottom:1px solid rgba(255,255,255,0.03);text-align:left}
    form input, form select, form textarea{width:100%;padding:8px;margin-top:6px;border-radius:6px;background:#061226;border:1px solid #123245;color:var(--text)}
    .btn{padding:8px 10px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer}
  </style>
</head>

    {id:49,전문성:68,리더십:62,협업:70,성과:67,소통:69,수료율:100,예상승진:'2027-01'},
    {id:50,전문성:82,리더십:76,협업:78,성과:80,소통:74,수료율:100,예상승진:'2026-07'}
  ];

  // helper: compute grade
  function gradeOf(t){ const avg = Math.round((t.전문성+t.리더십+t.협업+t.성과+t.소통)/5); if(avg>=90) return 'S'; if(avg>=80) return 'A'; if(avg>=70) return 'B'; return 'C'; }

  // tab switching
  function showPanel(id){ document.querySelectorAll('.panel').forEach(p=>p.style.display='none'); document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); document.getElementById(id+'Panel').style.display='block';
    // set active tab
    if(id==='employees') document.getElementById('tabEmployees').classList.add('active');
    if(id==='org') document.getElementById('tabOrg').classList.add('active');
    if(id==='projects') document.getElementById('tabProjects').classList.add('active');
    if(id==='talent') document.getElementById('tabTalent').classList.add('active');
    if(id==='add') document.getElementById('tabAdd').classList.add('active');
  }

  // render functions using innerHTML
  function renderEmployees(){ const el=document.getElementById('employeesContent'); el.innerHTML = employees.map(e=>{
    return `<div class="card"><div style="font-weight:700">${e.name}</div><div style="color:var(--muted)">${e.title}</div><div style="margin-top:8px;color:var(--muted)">${e.division} • ${e.age}세</div></div>`;
  }).join(''); }

  function renderOrg(){ const el=document.getElementById('orgContent'); // simple nested divs by division
    const groups = {};
    employees.forEach(e=>{ const d=e.division||'기타'; if(!groups[d]) groups[d]=[]; groups[d].push(e); });
    let html = '';
    for(const d in groups){ html += `<div style="margin-bottom:12px"><div style="font-weight:700;color:var(--muted)">${d}</div><div style="display:flex;gap:8px;margin-top:8px">`;
      groups[d].forEach(m=>{ html += `<div style="background:#041426;padding:8px;border-radius:6px"><div style="font-weight:700">${m.name}</div><div style="font-size:12px;color:var(--muted)">${m.title}</div></div>`; });
      html += `</div></div>`;
    }
    el.innerHTML = html;
  }

  function renderProjects(){ const el=document.getElementById('projectsContent'); el.innerHTML = projects.map(p=>{
    const assigned = p.assigned.map(id=>{ const emp = employees.find(e=>e.id===id); return emp? emp.name : 'ID:'+id; }).slice(0,4).join(', ');
    return `<div class="card"><div style="font-weight:700">${p.name}</div><div style="color:var(--muted);font-size:13px">${p.client} • 예산 ${p.budget.toLocaleString()}원</div><div style="margin-top:8px">진행 ${p.progress}%</div><div class="projBar" style="margin-top:6px"><div class="projFill" style="width:${p.progress}%"></div></div><div style="margin-top:8px;color:var(--muted);font-size:12px">담당: ${assigned}</div></div>`;
  }).join(''); }

  function renderTalent(){ const el=document.getElementById('talentContent');
    let html = '<table><thead><tr><th>이름</th><th>부서</th><th>등급</th><th>전문성</th><th>리더십</th><th>협업</th><th>교육수료율%</th><th>승진예정</th></tr></thead><tbody>';
    talent.forEach(t=>{ const emp = employees.find(e=>e.id===t.id) || {}; const g=gradeOf(t); html += `<tr><td style="font-weight:700">${emp.name||('ID:'+t.id)}</td><td style="color:var(--muted)">${emp.division||''}</td><td><strong>${g}</strong></td><td>${t.전문성}</td><td>${t.리더십||t.리더심||0}</td><td>${t.협업}</td><td style="color:var(--muted)">${t.수료율}%</td><td style="color:var(--muted)">${t.예상승진}</td></tr>`; });
    html += '</tbody></table>';
    el.innerHTML = html;
  }

  function renderAdd(){ const el=document.getElementById('addContent'); el.innerHTML = `
    <h2>직원 추가</h2>
    <form onsubmit="event.preventDefault(); alert('추가 기능은 데모입니다.');">
      <label>이름<input name="name" /></label>
      <label>나이<input name="age" /></label>
      <label>직책<input name="title" /></label>
      <label>부문<input name="division" /></label>
      <div style="margin-top:8px"><button class="btn" type="submit">추가</button></div>
    </form>
  `; }

  // wire tabs
  document.getElementById('tabEmployees').addEventListener('click',()=>{ showPanel('employees'); renderEmployees(); });
  document.getElementById('tabOrg').addEventListener('click',()=>{ showPanel('org'); renderOrg(); });
  document.getElementById('tabProjects').addEventListener('click',()=>{ showPanel('projects'); renderProjects(); });
  document.getElementById('tabTalent').addEventListener('click',()=>{ showPanel('talent'); renderTalent(); });
  document.getElementById('tabAdd').addEventListener('click',()=>{ showPanel('add'); renderAdd(); });

  // initial render
  renderEmployees();
  </script>
</body>
