<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Korea Strategy Group — Employee Directory</title>
</head>
<body style="margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;background:#0b1220;color:#e6eef8;-webkit-font-smoothing:antialiased">
  <div style="display:flex;flex-direction:column;min-height:100vh">
    <header style="padding:16px 20px;background:linear-gradient(90deg,#071031,#071a2a);display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.5)">
      <div style="display:flex;align-items:center;gap:12px">
        <h1 style="margin:0;font-size:18px;letter-spacing:0.4px">Korea Strategy Group</h1>
        <div style="font-size:12px;color:#9fb3d6;opacity:.9">직원 디렉터리</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <input id="search" placeholder="이름으로 검색" aria-label="search" style="padding:8px 10px;border-radius:8px;background:#061226;border:1px solid #123245;color:#e6eef8;outline:none;width:220px" />
        <div id="filters" style="display:flex;gap:8px;align-items:center"></div>
        <div style="display:flex;gap:8px;margin-left:8px;">
          <button id="tabCards" style="padding:8px 10px;border-radius:8px;background:#15405a;border:1px solid #123245;color:#e6eef8;cursor:pointer">직원 카드</button>
          <button id="tabOrg" style="padding:8px 10px;border-radius:8px;background:#071428;border:1px solid #0b2940;color:#9fb3d6;cursor:pointer">조직도</button>
          <button id="tabProjects" style="padding:8px 10px;border-radius:8px;background:#071428;border:1px solid #0b2940;color:#9fb3d6;cursor:pointer">프로젝트</button>
          <button id="tabTalent" style="padding:8px 10px;border-radius:8px;background:#071428;border:1px solid #0b2940;color:#9fb3d6;cursor:pointer">인재개발</button>
        </div>
        <button id="addEmployee" style="margin-left:12px;padding:8px 10px;border-radius:8px;background:#1b6f3a;border:1px solid #174f2b;color:#fff;cursor:pointer">직원 추가</button>
      </div>
    </header>

    <main style="padding:18px;flex:1;display:flex;gap:18px;align-items:flex-start">
      <section style="flex:1;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="color:#9fb3d6;font-size:13px">총 직원: <span id="count">--</span></div>
          <div style="color:#8fa7c8;font-size:12px">Dark theme · Vanilla JS · No frameworks</div>
        </div>

        <div id="cards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px"></div>
        <div id="orgView" style="display:none;padding:6px;border-radius:8px;background:#071428;color:#e6eef8"></div>
        <div id="projectsView" style="display:none;padding:6px;border-radius:8px;background:#071428;color:#e6eef8"></div>
        <div id="talentView" style="display:none;padding:12px;border-radius:8px;background:#071428;color:#e6eef8">
          <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">
            <div style="flex:1">
              <select id="talentSelect" style="width:100%;padding:8px;border-radius:8px;background:#061226;border:1px solid #123245;color:#e6eef8"></select>
            </div>
            <div style="min-width:140px;text-align:right;color:#9fb3d6;font-size:13px">인재개발 대시보드</div>
          </div>
          <div id="talentList" style="max-height:520px;overflow:auto;padding-top:8px;display:block"></div>
          <div id="talentContent" style="display:flex;gap:12px">
            <div style="flex:1;display:flex;flex-direction:column;gap:12px">
              <div id="scoresCard" style="padding:12px;background:#061526;border-radius:8px"></div>
              <div id="coursesCard" style="padding:12px;background:#061526;border-radius:8px"></div>
              <div id="careerCard" style="padding:12px;background:#061526;border-radius:8px"></div>
            </div>
            <div style="width:320px;display:flex;flex-direction:column;gap:12px">
              <div id="projectsCard" style="padding:12px;background:#061526;border-radius:8px;min-height:180px;overflow:auto"></div>
              <div id="trendCard" style="padding:12px;background:#061526;border-radius:8px;min-height:160px">
                <div style="font-weight:700;margin-bottom:8px">월간 성과 추세</div>
                <canvas id="trendChart" width="300" height="120" style="width:100%;height:120px;background:transparent"></canvas>
              </div>
            </div>
          </div>
        </div>

        <div id="noResults" style="display:none;color:#9fb3d6;padding:18px;background:#071428;border-radius:8px">검색 결과가 없습니다.</div>
      </section>

      <aside style="width:280px;display:flex;flex-direction:column;gap:12px">
        <div style="background:#071428;padding:12px;border-radius:8px">
          <div style="font-size:13px;color:#9fb3d6;margin-bottom:8px">필터 (부문)</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button data-division="전체" class="filterBtn" style="padding:8px 10px;border-radius:8px;background:#123046;border:1px solid #123046;color:#e6eef8;cursor:pointer">전체</button>
            <button data-division="연구부문" class="filterBtn" style="padding:8px 10px;border-radius:8px;background:#071428;border:1px solid #0b2940;color:#9fb3d6;cursor:pointer">연구부문</button>
            <button data-division="과제수행" class="filterBtn" style="padding:8px 10px;border-radius:8px;background:#071428;border:1px solid #0b2940;color:#9fb3d6;cursor:pointer">과제수행</button>
            <button data-division="정치컨설팅" class="filterBtn" style="padding:8px 10px;border-radius:8px;background:#071428;border:1px solid #0b2940;color:#9fb3d6;cursor:pointer">정치컨설팅</button>
          </div>
        </div>

        <div style="background:#071428;padding:12px;border-radius:8px">
          <div style="font-size:13px;color:#9fb3d6;margin-bottom:8px">도움말</div>
          <div style="font-size:12px;color:#8fa7c8">이름으로 검색하거나 부문 버튼을 사용해 필터하세요.</div>
        </div>
      </aside>
    </main>

    <footer style="padding:12px 18px;background:#021226;color:#90b0d6;font-size:12px;text-align:right">데이터: employees.json</footer>
  </div>

  <script>
  (function(){
    const cardsEl = document.getElementById('cards');
    const orgEl = document.getElementById('orgView');
    const projectsEl = document.getElementById('projectsView');
    const countEl = document.getElementById('count');
    const noResultsEl = document.getElementById('noResults');
    const searchEl = document.getElementById('search');
    const filtersEl = document.getElementById('filters');
    const filterButtons = Array.from(document.getElementsByClassName('filterBtn'));
    const tabCards = document.getElementById('tabCards');
    const tabOrg = document.getElementById('tabOrg');
    const tabProjects = document.getElementById('tabProjects');
    const addEmployeeBtn = document.getElementById('addEmployee');
    let employees = [];
    let activeDivision = '전체';
    let q = '';
    let viewMode = 'cards'; // 'cards' or 'org'
    let editSession = { mode: null, id: null };

    // create modals (profile and edit)
    const modalOverlay = document.createElement('div');
    modalOverlay.style.position='fixed'; modalOverlay.style.left=0; modalOverlay.style.top=0; modalOverlay.style.right=0; modalOverlay.style.bottom=0;
    modalOverlay.style.background='rgba(2,6,12,0.6)'; modalOverlay.style.display='none'; modalOverlay.style.alignItems='center'; modalOverlay.style.justifyContent='center'; modalOverlay.style.zIndex=9999;
    modalOverlay.addEventListener('click',(e)=>{ if(e.target===modalOverlay) closeModal(); });
    const modalBox = document.createElement('div'); modalBox.style.background='#071428'; modalBox.style.borderRadius='8px'; modalBox.style.padding='16px'; modalBox.style.minWidth='320px'; modalBox.style.maxWidth='760px'; modalBox.style.maxHeight='80vh'; modalBox.style.overflow='auto'; modalOverlay.appendChild(modalBox);
    document.body.appendChild(modalOverlay);

    function openModal(contentEl){ modalBox.innerHTML=''; modalBox.appendChild(contentEl); modalOverlay.style.display='flex'; }
    function closeModal(){ modalOverlay.style.display='none'; editSession.mode=null; editSession.id=null; }

    function normalizeDivision(d){
      if(!d) return '기타';
      if(d.indexOf('연구')!==-1) return '연구부문';
      if(d.indexOf('과제')!==-1) return '과제수행';
      if(d.indexOf('정치')!==-1) return '정치컨설팅';
      return d;
    }

    function matchName(emp, q){
      if(!q) return true;
      return emp.name.indexOf(q)!==-1 || (emp.title && emp.title.indexOf(q)!==-1);
    }

    function render(){
      const filtered = employees.filter(emp => {
        const div = normalizeDivision(emp.division || emp.div || emp['division']);
        const divisionMatch = activeDivision === '전체' || div === activeDivision;
        return divisionMatch && matchName(emp, q);
      });

      cardsEl.innerHTML = '';
      countEl.textContent = filtered.length + '/' + employees.length;
      if(filtered.length === 0){ noResultsEl.style.display = 'block'; } else { noResultsEl.style.display = 'none'; }

      filtered.forEach(emp => {
        const card = document.createElement('div');
        card.style.background = '#071428';
        card.style.padding = '12px';
        card.style.borderRadius = '8px';
        card.style.boxShadow = 'inset 0 1px 0 rgba(255,255,255,0.02)';
        card.style.display = 'flex';
        card.style.flexDirection = 'column';

        const nameRow = document.createElement('div'); nameRow.style.display='flex'; nameRow.style.justifyContent='space-between'; nameRow.style.alignItems='center';
        const name = document.createElement('div'); name.textContent = emp.name || emp.name_kor || 'Unknown'; name.style.fontWeight='700'; name.style.fontSize='16px';
        const age = document.createElement('div'); age.textContent = (emp.age? emp.age + '세' : ''); age.style.fontSize='13px'; age.style.opacity='0.9';
        nameRow.appendChild(name); nameRow.appendChild(age);

        const role = document.createElement('div'); role.textContent = emp.title || emp.role || ''; role.style.color='#cfe6ff'; role.style.marginTop='8px'; role.style.fontSize='13px';
        const division = document.createElement('div'); division.textContent = normalizeDivision(emp.division || emp.div || emp['division'] || ''); division.style.fontSize='12px'; division.style.color='#9fb3d6'; division.style.marginTop='6px';

        const traits = document.createElement('div'); traits.style.display='flex'; traits.style.flexWrap='wrap'; traits.style.gap='6px'; traits.style.marginTop='10px';
        const tlist = emp.personality || emp.personalityTraits || emp.traits || emp.personality || emp.personality || [];
        (Array.isArray(tlist) ? tlist : (tlist? [tlist] : [])).forEach(t=>{ const chip=document.createElement('div'); chip.textContent=t; chip.style.padding='6px 8px'; chip.style.fontSize='12px'; chip.style.background='#061526'; chip.style.borderRadius='6px'; chip.style.color='#bfe9ff'; traits.appendChild(chip)});

        card.appendChild(nameRow); card.appendChild(role); card.appendChild(division); card.appendChild(traits);
        cardsEl.appendChild(card);
      });
    }

    function setActiveFilter(name){
      activeDivision = name;
      filterButtons.forEach(b => {
        if(b.getAttribute('data-division')===name){ b.style.background = '#1b4f72'; b.style.color='#fff'; b.style.border='1px solid #1b4f72' }
        else { b.style.background = '#071428'; b.style.color='#9fb3d6'; b.style.border='1px solid #0b2940' }
      });
      render();
    }

    filterButtons.forEach(b=>{ b.addEventListener('click',()=> setActiveFilter(b.getAttribute('data-division'))) });

    // allow quick keyboard search
    searchEl.addEventListener('input', e=>{ q = e.target.value.trim(); render(); });

    { "id": 2,  "name": "강민수", "age": 49, "title": "연구부문장(상무)", "division": "연구부문", "personality": "꼼꼼하고 논리적이며 신중함", "strength": "데이터 해석과 보고서 품질관리", "weakness": "변화에 보수적", "expertise": "정책연구, 통계분석" },

    };

    function seedForId(id){ return (id*9301+49297)%233280; }
    function randFromSeed(id, min, max){ const s = seedForId(id); return Math.floor(min + (s/233280)*(max-min)); }

    function getTalentFor(id){
      if(TALENT[id]) return TALENT[id];
      const scores = { 전문성: randFromSeed(id,55,90), 리더십: randFromSeed(id+1,50,88), 협업: randFromSeed(id+2,50,92), 성과: randFromSeed(id+3,45,90), 소통: randFromSeed(id+4,48,90) };
      const courses = [ {name:'기본 직무교육', category:'정책연구', status: (randFromSeed(id,0,100)>60?'completed':'in-progress')}, {name:'커뮤니케이션 워크숍', category:'커뮤니케이션', status:(randFromSeed(id+5,0,100)>70?'planned':'in-progress')} ];
      const career = { level: (randFromSeed(id,1,100)>90?'부문장': (randFromSeed(id,1,100)>75?'수석연구원': (randFromSeed(id,1,100)>55?'책임연구원': (randFromSeed(id,1,100)>35?'선임연구원':'연구원')))) };
      const monthly = {};
      for(let m=1;m<=6;m++){ const key = '2026-' + String(m).padStart(2,'0'); monthly[key] = Math.max(40, Math.min(98, Math.round((Object.values(scores).reduce((a,b)=>a+b,0)/5) + randFromSeed(id+m,-8,8)))); }
      return { scores, courses, career, monthly };
    }

    // Note: TALENT is fully hardcoded above for all 50 employees.

    function avgScore(scores){ const vals = Object.values(scores||{}); if(!vals.length) return 0; return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length); }
    function gradeFrom(avg){ if(avg>=90) return 'S'; if(avg>=80) return 'A'; if(avg>=70) return 'B'; return 'C'; }

    function drawBar(container, label, value){ const wrap = document.createElement('div'); wrap.style.marginBottom='8px'; const row = document.createElement('div'); row.style.display='flex'; row.style.justifyContent='space-between'; row.style.alignItems='center'; const lab = document.createElement('div'); lab.textContent=label; lab.style.color='#cfe6ff'; const val = document.createElement('div'); val.textContent=value+'점'; val.style.color='#9fb3d6'; row.appendChild(lab); row.appendChild(val); const barBg = document.createElement('div'); barBg.style.background='#061426'; barBg.style.height='10px'; barBg.style.borderRadius='6px'; barBg.style.marginTop='6px'; barBg.style.overflow='hidden'; const bar = document.createElement('div'); bar.style.height='100%'; bar.style.width=Math.max(4,Math.min(100,value))+'%'; bar.style.background = (value>=90? '#ffd166': (value>=80? '#76c893': '#4ea1ff')); barBg.appendChild(bar); wrap.appendChild(row); wrap.appendChild(barBg); container.appendChild(wrap); }

    function renderTalentFor(empId){
      const emp = employees.find(e=>e.id===empId); if(!emp) return;
      const data = Object.assign({}, getTalentFor(empId)); if(!data.monthly){ // ensure monthly exists
        data.monthly = {};
        for(let m=1;m<=6;m++){ data.monthly['2026-'+String(m).padStart(2,'0')] = avgScore(data.scores) + (m-3)*2; }
      }

      const scoresCard = document.getElementById('scoresCard'); scoresCard.innerHTML='';
      const title = document.createElement('div'); title.style.fontWeight='700'; title.textContent = emp.name + ' • 역량 점수'; scoresCard.appendChild(title);
      const avg = avgScore(data.scores); const grade = gradeFrom(avg);
      const gradeRow = document.createElement('div'); gradeRow.style.marginTop='6px'; gradeRow.innerHTML = '<div style="font-size:13px;color:#9fb3d6">평균: <strong style="color:#cfe6ff">'+avg+'점</strong> · 등급: <strong style="color:#ffd166">'+grade+'</strong></div>';
      scoresCard.appendChild(gradeRow);
      const list = document.createElement('div'); list.style.marginTop='8px'; for(const k of ['전문성','리더십','협업','성과','소통']){ drawBar(list, k, data.scores[k] || 0); }
      scoresCard.appendChild(list);

      const coursesCard = document.getElementById('coursesCard'); coursesCard.innerHTML=''; const t1=document.createElement('div'); t1.style.fontWeight='700'; t1.textContent='교육 과정 & 수료 현황'; coursesCard.appendChild(t1);
      const tbl = document.createElement('div'); tbl.style.marginTop='8px'; (data.courses||[]).forEach(c=>{ const row=document.createElement('div'); row.style.display='flex'; row.style.justifyContent='space-between'; row.style.padding='6px 0'; row.style.borderBottom='1px solid rgba(255,255,255,0.02)'; const left=document.createElement('div'); left.textContent=c.name + ' · ' + c.category; left.style.color='#cfe6ff'; const right=document.createElement('div'); right.textContent = (c.status==='completed'? '수료':'진행중' || '예정'); right.style.color = (c.status==='completed'? '#76c893': (c.status==='in-progress'? '#ffd166':'#9fb3d6')); row.appendChild(left); row.appendChild(right); tbl.appendChild(row); });
      const completed = (data.courses||[]).filter(x=>x.status==='completed').length; const total = (data.courses||[]).length; const rate = total? Math.round((completed/total)*100):0;
      const rateLine = document.createElement('div'); rateLine.style.marginTop='8px'; rateLine.innerHTML = '<strong>수료율:</strong> '+rate+'% ('+completed+'/'+total+')'; coursesCard.appendChild(tbl); coursesCard.appendChild(rateLine);

      const careerCard = document.getElementById('careerCard'); careerCard.innerHTML=''; const ctitle=document.createElement('div'); ctitle.style.fontWeight='700'; ctitle.textContent='승진 & 커리어 트랙'; careerCard.appendChild(ctitle);
      const path = ['연구원','선임연구원','책임연구원','수석연구원','부문장']; const curr = data.career && data.career.level? data.career.level : '연구원'; const idx = path.indexOf(curr) >=0 ? path.indexOf(curr) : 0; const next = idx<path.length-1? path[idx+1] : '(최고등급)';
      const curLine = document.createElement('div'); curLine.style.marginTop='8px'; curLine.innerHTML = '<div style="color:#cfe6ff">현재 레벨: '+curr+'</div><div style="color:#9fb3d6">다음 승진: '+next+'</div>';
      careerCard.appendChild(curLine);
      // simple promotion requirement: avg >= 80 for next
      const required = 80; const monthsTo = Math.max(0, Math.ceil((required - avg)/2)); const est = new Date(); est.setMonth(est.getMonth()+monthsTo); const estStr = est.getFullYear()+'-'+String(est.getMonth()+1).padStart(2,'0');
      const reqLine = document.createElement('div'); reqLine.style.marginTop='8px'; reqLine.innerHTML = '<div style="color:#9fb3d6">다음 승진 요건: 평균점수 ≥ '+required+'점</div><div style="color:#cfe6ff">예상 승진일: '+estStr+'</div>';
      careerCard.appendChild(reqLine);

      // projects card: link to projects and show contribution
      const projectsCard = document.getElementById('projectsCard'); projectsCard.innerHTML=''; const ptitle=document.createElement('div'); ptitle.style.fontWeight='700'; ptitle.textContent='프로젝트 성과 기반 평가'; projectsCard.appendChild(ptitle);
      const plist = document.createElement('div'); plist.style.marginTop='8px'; const empProjects = projects.filter(p=> (p.assigned_employee_ids||[]).includes(empId)); if(empProjects.length===0){ const none=document.createElement('div'); none.style.color='#9fb3d6'; none.textContent='할당된 프로젝트가 없습니다.'; plist.appendChild(none); } else { empProjects.forEach(p=>{ const row=document.createElement('div'); row.style.display='flex'; row.style.justifyContent='space-between'; row.style.padding='8px 0'; row.style.borderBottom='1px solid rgba(255,255,255,0.02)'; const left=document.createElement('div'); left.innerHTML = '<div style="font-weight:700">'+p.name+'</div><div style="font-size:12px;color:#9fb3d6">진행 '+p.progress+'% • '+p.client+'</div>'; const contrib = Math.round((avg + p.progress)/2); const right=document.createElement('div'); right.style.textAlign='right'; right.innerHTML = '<div style="font-weight:700;color:#ffd166">기여 '+contrib+'점</div><div style="font-size:12px;color:#9fb3d6">상세 보기</div>'; row.appendChild(left); row.appendChild(right); plist.appendChild(row); }); }
      projectsCard.appendChild(plist);

      // draw trend chart
      const canvas = document.getElementById('trendChart'); const ctx = canvas.getContext('2d'); const months = Object.keys(data.monthly||{}).slice(-6); const vals = months.map(m=>data.monthly[m]); drawTrendChart(ctx, months, vals);
    }

    function renderAllTalent(){
      const list = document.getElementById('talentList'); list.innerHTML='';
      employees.forEach(emp=>{
        const data = getTalentFor(emp.id);
        const card = document.createElement('div'); card.style.background='#061526'; card.style.padding='10px'; card.style.borderRadius='8px'; card.style.marginBottom='8px';
        const h = document.createElement('div'); h.style.display='flex'; h.style.justifyContent='space-between'; h.style.alignItems='center'; h.innerHTML = '<div style="font-weight:700">'+emp.name+'</div><div style="color:#9fb3d6;font-size:12px">'+(emp.title||'')+'</div>';
        card.appendChild(h);
        const avg = avgScore(data.scores); const grade = gradeFrom(avg);
        const meta = document.createElement('div'); meta.style.marginTop='6px'; meta.innerHTML = '<div style="color:#cfe6ff">평균 '+avg+'점 · 등급 <strong style="color:#ffd166">'+grade+'</strong></div>';
        card.appendChild(meta);
        const bars = document.createElement('div'); bars.style.display='flex'; bars.style.gap='6px'; bars.style.marginTop='8px'; bars.style.flexWrap='wrap';
        ['전문성','리더십','협업','성과','소통'].forEach(k=>{ const small=document.createElement('div'); small.style.width='18%'; small.style.minWidth='80px'; small.style.fontSize='11px'; small.style.color='#cfe6ff'; small.innerHTML = '<div style="margin-bottom:6px">'+k+'</div>'; const val = data.scores[k] || 0; const bg=document.createElement('div'); bg.style.background='#041624'; bg.style.height='8px'; bg.style.borderRadius='4px'; const fg=document.createElement('div'); fg.style.width=Math.max(4,Math.min(100,val))+'%'; fg.style.height='100%'; fg.style.background=(val>=90? '#ffd166': (val>=80? '#76c893':'#4ea1ff')); bg.appendChild(fg); small.appendChild(bg); bars.appendChild(small); });
        card.appendChild(bars);
        const courses = document.createElement('div'); courses.style.marginTop='8px'; const completed = (data.courses||[]).filter(x=>x.status==='completed').length; const total = (data.courses||[]).length; courses.innerHTML = '<div style="color:#9fb3d6;font-size:12px">수료율: '+(total?Math.round((completed/total)*100):0)+'% ('+completed+'/'+total+')</div>';
        card.appendChild(courses);
        const career = document.createElement('div'); career.style.marginTop='6px'; career.innerHTML = '<div style="color:#cfe6ff;font-size:12px">레벨: '+(data.career&&data.career.level?data.career.level:'연구원')+'</div>';
        card.appendChild(career);
        // small project contributions
        const empproj = projects.filter(p=> (p.assigned_employee_ids||[]).includes(emp.id));
        const projdiv = document.createElement('div'); projdiv.style.marginTop='6px'; projdiv.style.fontSize='12px'; projdiv.style.color='#9fb3d6'; projdiv.textContent = '프로젝트: ' + (empproj.length? empproj.map(p=>p.name).slice(0,2).join(', '): '없음');
        card.appendChild(projdiv);
        list.appendChild(card);
      });
    }

    function drawTrendChart(ctx, labels, values){ const w = ctx.canvas.width; const h = ctx.canvas.height; ctx.clearRect(0,0,w,h); const max = Math.max(100, ...values); const pad = 20; const barW = (w - pad*2) / Math.max(1, values.length); values.forEach((v,i)=>{ const x = pad + i*barW + 6; const barH = Math.round((v/max) * (h - pad)); ctx.fillStyle = '#4ea1ff'; ctx.fillRect(x, h - pad - barH, barW - 12, barH); ctx.fillStyle = '#cfe6ff'; ctx.font='11px sans-serif'; ctx.fillText(String(v), x, h - pad - barH - 6); ctx.fillStyle = '#9fb3d6'; ctx.fillText(labels[i].slice(5), x, h - 4); }); }

    // populate selector and wire tab
    const talentSelect = document.getElementById('talentSelect'); employees.forEach(e=>{ const opt=document.createElement('option'); opt.value=e.id; opt.textContent = e.name + ' • ' + (e.title||''); talentSelect.appendChild(opt); });
    const tabTalent = document.getElementById('tabTalent'); tabTalent.addEventListener('click', ()=>{ window.open('talent.html','_blank'); });
    talentSelect.addEventListener('change', ()=> renderTalentFor(Number(talentSelect.value)));

    setActiveFilter('전체');
  })();
