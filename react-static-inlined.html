  { id: 49, name: "권나윤", age: 28, title: "컨설턴트", division: "정치컨설팅부문", personality: "성실하고 밝음", strength: "홍보물·콘텐츠 제작", weakness: "경험 부족", expertise: "정치 홍보 콘텐츠" },
  { id: 50, name: "조민혁", age: 33, title: "선임컨설턴트", division: "정치컨설팅부문", personality: "분석적이고 신중함", strength: "정책공약 설계", weakness: "결정 지연", expertise: "공약·정책 개발" }
];

const DIV_COLORS = {
  "경영진":        { bg: "#a78bfa", tag: "#a78bfa22", text: "#c4b5fd" },
  "연구부문":      { bg: "#38bdf8", tag: "#38bdf822", text: "#7dd3fc" },
  "과제수행부문":  { bg: "#4ade80", tag: "#4ade8022", text: "#86efac" },
  "정치컨설팅부문": { bg: "#fb923c", tag: "#fb923c22", text: "#fdba74" }
};

const FILTERS = ["전체", "연구부문", "과제수행부문", "정치컨설팅부문", "경영진"];

function Card({ e }) {
  const c = DIV_COLORS[e.division] || DIV_COLORS["연구부문"];
  return (
    <div className="card">
      <div className="top">
        <div className="avatar" style={{ background: c.bg }}>{e.name.charAt(0)}</div>
        <div>
          <div className="name">{e.name} <span style={{ color: "#64748b", fontSize: 13, fontWeight: 400 }}>· {e.age}세</span></div>
          <div className="role">{e.title}</div>
          <span className="tag" style={{ background: c.tag, color: c.text }}>{e.division}</span>
        </div>
      </div>
      <div className="field"><span className="k">전문</span>{e.expertise}</div>
      <div className="field"><span className="k">성격</span>{e.personality}</div>
      <div className="field"><span className="k strength">강점</span>{e.strength}</div>
      <div className="field"><span className="k weakness">약점</span>{e.weakness}</div>
    </div>
  );
}

function App() {
  const [filter, setFilter] = React.useState("전체");
  const [query, setQuery] = React.useState("");

  const filtered = EMPLOYEES.filter(e => {
    const okDiv = filter === "전체" || e.division === filter;
    const q = query.trim().toLowerCase();
    const okQ = !q || [e.name, e.title, e.division, e.personality, e.strength, e.weakness, e.expertise]
      .join(" ").toLowerCase().includes(q);
    return okDiv && okQ;
  });

  const count = d => EMPLOYEES.filter(e => e.division === d).length;

  return (
    <div className="wrap">
      <header>
        <h1>코리아전략그룹 · 직원 대시보드</h1>
        <div className="sub">Korea Strategy Group — 전체 {EMPLOYEES.length}명 · 부서별 필터 및 검색</div>
      </header>

      <div className="stats">
        <div className="stat"><div className="n">{EMPLOYEES.length}</div><div className="l">전체 인원</div></div>
        <div className="stat"><div className="n">{count("연구부문")}</div><div className="l">연구부문</div></div>
        <div className="stat"><div className="n">{count("과제수행부문")}</div><div className="l">과제수행부문</div></div>
        <div className="stat"><div className="n">{count("정치컨설팅부문")}</div><div className="l">정치컨설팅부문</div></div>
      </div>

      <div className="toolbar">
        <input
          className="search"
          placeholder="이름 · 직책 · 전문분야 · 성격 검색…"
          value={query}
          onChange={e => setQuery(e.target.value)}
        />
        <div className="filters">
          {FILTERS.map(f => (
            <button
              key={f}
              className={"chip" + (filter === f ? " active" : "")}
              onClick={() => setFilter(f)}
            >{f}</button>
          ))}
        </div>
      </div>

      <div style={{ color: "#64748b", fontSize: 13, marginBottom: 14 }}>
        {filtered.length}명 표시 중
      </div>

      {filtered.length === 0
        ? <div className="empty">검색 결과가 없습니다.</div>
        : <div className="grid">{filtered.map(e => <Card key={e.id} e={e} />)}</div>}

      <footer>© 2026 코리아전략그룹 (Korea Strategy Group) · 내부용 직원 대시보드</footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
